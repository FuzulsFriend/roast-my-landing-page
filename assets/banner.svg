  <!-- Trust 35 CRITICAL -->
  <text x="920" y="254" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#94a3b8">Trust &amp; Proof</text>
  <text x="1100" y="254" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#ef4444">!! critical</text>
  <rect x="920" y="262" width="260" height="8" rx="4" fill="#0f172a"/>
  <rect x="920" y="262" width="91" height="8" rx="4" fill="#ef4444"/>
  <text x="1190" y="271" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#ef4444" text-anchor="end">35</text>

  <!-- Mobile 76 -->
  <text x="920" y="292" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#94a3b8">Mobile &amp; Access</text>
  <rect x="920" y="300" width="260" height="8" rx="4" fill="#0f172a"/>
  <rect x="920" y="300" width="198" height="8" rx="4" fill="#f59e0b"/>
  <text x="1190" y="309" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#f59e0b" text-anchor="end">76</text>

  <!-- Performance 38 CRITICAL -->
  <text x="920" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#94a3b8">Performance</text>
  <text x="1100" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#ef4444">!! critical</text>
  <rect x="920" y="338" width="260" height="8" rx="4" fill="#0f172a"/>
  <rect x="920" y="338" width="99" height="8" rx="4" fill="#ef4444"/>
  <text x="1190" y="347" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#ef4444" text-anchor="end">38</text>

  <!-- Divider -->
  <line x1="680" y1="376" x2="1200" y2="376" stroke="#334155" stroke-width="1"/>

  <!-- Top roast preview -->
  <rect x="680" y="390" width="500" height="60" rx="8" fill="#1a0a0a" stroke="#7f1d1d" stroke-width="1"/>
  <rect x="680" y="390" width="4" height="60" rx="2" fill="#ef4444"/>
  <text x="696" y="413" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#fca5a5">🔥 No testimonials, no logos, no user count</text>
  <text x="696" y="433" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#64748b">Fix: Add 3 beta user quotes with names → Trust: 35 → 65</text>
  <rect x="1130" y="398" width="42" height="22" rx="11" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
  <text x="1151" y="413" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#78716c" text-anchor="middle">2h</text>

  <!-- Path to improvement -->
  <text x="680" y="480" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b">Path to improvement:</text>
  <text x="680" y="503" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="800" fill="#f97316">D</text>
  <text x="706" y="503" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#334155">——→</text>
  <text x="756" y="503" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="800" fill="#22c55e">C+</text>
  <text x="793" y="503" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b">  in 3 hours  ·  projected 76 / 100</text>

  <!-- ── FOOTER ── -->
  <line x1="0" y1="598" x2="1280" y2="598" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="622" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#334155">by</text>
  <text x="79" y="622" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#f97316">FuzulsFriend</text>
  <text x="1220" y="622" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#334155" text-anchor="end">Claude Code Skill · MIT License</text>
