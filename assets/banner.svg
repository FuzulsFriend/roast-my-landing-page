<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#475569" opacity="0.35"/>
    </pattern>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#0f172a"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Top accent bar -->
  <rect width="1280" height="3" fill="url(#accentGrad)"/>

  <!-- ── LEFT PANEL ── -->

  <!-- Category label -->
  <text x="60" y="88" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#f97316" letter-spacing="3">ROAST MY LANDING PAGE</text>

  <!-- Main headline -->
  <text x="60" y="152" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="800" fill="#f1f5f9">Your landing page,</text>
  <text x="60" y="216" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="800" fill="#f1f5f9"><tspan fill="#f97316">honestly</tspan> reviewed.</text>

  <!-- Subtitle -->
  <text x="60" y="272" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#94a3b8">Score out of 100. Real fixes. Plain English.</text>
  <text x="60" y="300" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#94a3b8">No UX experience needed to understand the results.</text>

  <!-- 6 dimension pills -->
  <text x="60" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b">6 dimensions scored:</text>

  <rect x="60" y="360" width="138" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="129" y="379" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#f1f5f9" text-anchor="middle">First Impression</text>

  <rect x="208" y="360" width="128" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="272" y="379" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#f1f5f9" text-anchor="middle">Copy &amp; Messaging</text>

  <rect x="346" y="360" width="110" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="401" y="379" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#f1f5f9" text-anchor="middle">Call-to-Action</text>

  <rect x="60" y="398" width="104" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="112" y="417" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#f1f5f9" text-anchor="middle">Trust &amp; Proof</text>

  <rect x="174" y="398" width="132" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="240" y="417" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#f1f5f9" text-anchor="middle">Mobile &amp; Access</text>

  <rect x="316" y="398" width="98" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="365" y="417" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#f1f5f9" text-anchor="middle">Performance</text>

  <!-- Framework line -->
  <text x="60" y="468" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#475569">Built on</text>
  <text x="109" y="468" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#64748b">Nielsen Heuristics · StoryBrand · CRO Pyramid · WCAG 2.2 AA</text>

  <!-- ── RIGHT PANEL — Score Report Card ── -->
  <rect x="660" y="72" width="560" height="500" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Card header -->
  <rect x="660" y="72" width="560" height="48" rx="0" fill="#172033"/>
  <rect x="660" y="72" width="560" height="14" rx="14" fill="#172033"/>
  <rect x="660" y="100" width="560" height="20" fill="#172033"/>
  <text x="680" y="103" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#475569" letter-spacing="2">AUDIT REPORT · mark-it.co</text>

  <!-- Score gauge SVG circle -->
  <circle cx="790" cy="248" r="88" fill="none" stroke="#1e3a5f" stroke-width="12"/>
  <circle cx="790" cy="248" r="88" fill="none" stroke="#f97316" stroke-width="12"
    stroke-dasharray="553" stroke-dashoffset="368"
    stroke-linecap="round"
    transform="rotate(-90 790 248)"/>
  <text x="790" y="238" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="800" fill="#f1f5f9" text-anchor="middle">67</text>
  <text x="790" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">/ 100</text>
  <text x="790" y="295" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#f97316" text-anchor="middle">D</text>

  <!-- Dimension bars (right side) -->
  <!-- First Impression 74 -->
  <text x="920" y="140" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#94a3b8">First Impression</text>
  <rect x="920" y="148" width="260" height="8" rx="4" fill="#0f172a"/>
  <rect x="920" y="148" width="192" height="8" rx="4" fill="#f59e0b"/>
  <text x="1190" y="157" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#f59e0b" text-anchor="end">74</text>

  <!-- Copy 78 -->
  <text x="920" y="178" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#94a3b8">Copy &amp; Messaging</text>
  <rect x="920" y="186" width="260" height="8" rx="4" fill="#0f172a"/>
  <rect x="920" y="186" width="203" height="8" rx="4" fill="#f59e0b"/>
  <text x="1190" y="195" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#f59e0b" text-anchor="end">78</text>

  <!-- CTA 74 -->
  <text x="920" y="216" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#94a3b8">Call-to-Action</text>
  <rect x="920" y="224" width="260" height="8" rx="4" fill="#0f172a"/>
  <rect x="920" y="224" width="192" height="8" rx="4" fill="#f59e0b"/>
